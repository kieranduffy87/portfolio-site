<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unfold — KD Lab</title>
<meta name="description" content="A pinned scroll sequence: a mark assembles, a landing page composes itself around it. An experiment by Kieran Duffy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0339f8;--ink:#0a0b0e;--paper:#f4f3ef}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Instrument Sans",-apple-system,Helvetica,Arial,sans-serif;overflow-x:hidden;background:var(--paper);color:var(--ink)}
a{color:inherit;text-decoration:none}
.head{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
 padding:clamp(1.1rem,3vw,2rem) clamp(1.25rem,4vw,3rem);z-index:9;font-size:.68rem;letter-spacing:.18em;
 text-transform:uppercase;color:rgba(10,11,14,.5)}
.back{border:1px solid rgba(10,11,14,.18);padding:.5rem 1rem;border-radius:100px}
.back:hover{border-color:var(--blue);color:var(--blue)}
.rail{height:560vh;position:relative}
.pin{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:center}
.canvas{position:relative;width:100%;height:100%;display:grid;place-items:center}
.mark{width:min(46vw,520px);will-change:transform}
.mark svg{width:100%;height:auto;display:block;overflow:visible}
.pc{will-change:transform,opacity}
.stack{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.nav-mock{position:absolute;top:clamp(4.5rem,9vh,6.5rem);left:50%;transform:translateX(-50%);
 display:flex;align-items:center;gap:.4rem;padding:.55rem .65rem;border-radius:100px;
 background:rgba(255,255,255,.72);border:1px solid rgba(10,11,14,.1);backdrop-filter:blur(14px);
 box-shadow:0 8px 32px rgba(10,11,14,.1);will-change:transform,opacity;opacity:0}
.nav-mock i{width:22px;height:16px;display:block}
.nav-mock span{font-size:.86rem;font-weight:500;color:rgba(10,11,14,.6);padding:.5rem .95rem}
.nav-mock b{font-size:.86rem;font-weight:600;color:#fff;background:var(--blue);padding:.55rem 1.3rem;border-radius:100px}
.hero-copy{position:absolute;left:clamp(1.25rem,6vw,5rem);bottom:clamp(4rem,12vh,8rem);max-width:min(52vw,720px);will-change:transform,opacity}
.hero-copy h1{font-size:clamp(2.2rem,6.4vw,5.6rem);font-weight:600;letter-spacing:-.04em;line-height:.98}
.hero-copy h1 em{font-style:normal;color:var(--blue)}
.hero-copy p{margin-top:1rem;color:rgba(10,11,14,.55);max-width:40ch}
.tiles{position:absolute;right:clamp(1.25rem,5vw,4rem);bottom:clamp(4rem,12vh,8rem);display:flex;gap:.8rem}
.tile{width:clamp(74px,9vw,120px);aspect-ratio:3/4;border-radius:12px;will-change:transform,opacity;opacity:0;
 box-shadow:0 14px 40px rgba(10,11,14,.16)}
.cap{position:absolute;left:50%;top:clamp(9rem,17vh,12rem);transform:translateX(-50%);text-align:center;
 font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(10,11,14,.4);will-change:opacity}
.bar{position:fixed;left:0;top:0;height:2px;background:var(--blue);width:0;z-index:10}
@media(prefers-reduced-motion:reduce){.rail{height:auto}.pin{position:static;height:auto;padding:18vh 0}
 .nav-mock,.tile{opacity:1}}
</style>
</head>
<body>
<div class="head"><a class="back" href="../../playground.html">← Playground</a><span>KD Lab / 06</span></div>
<div class="bar" id="bar"></div>
<div class="rail" id="rail">
  <section class="pin">
    <div class="canvas">
      <p class="cap" id="cap">Scroll to assemble</p>
      <div class="mark" id="mark">
        <svg viewBox="0 0 18.62 11.73" xmlns="http://www.w3.org/2000/svg">
          <polygon class="pc" id="pBlue" fill="#0339f8" points="18.62 0 12 0 6 5.86 12 11.73 18.62 11.73 12.62 5.86 18.62 0"/>
          <polygon class="pc" id="pInk" fill="#0a0b0e" points="0 0 0 11.72 6 5.86 0 0"/>
        </svg>
      </div>
      <div class="stack">
        <div class="nav-mock" id="navMock">
          <i><svg viewBox="0 0 18.62 11.73" xmlns="http://www.w3.org/2000/svg"><polygon fill="#0339f8" points="18.62 0 12 0 6 5.86 12 11.73 18.62 11.73 12.62 5.86 18.62 0"/><polygon fill="#0a0b0e" points="0 0 0 11.72 6 5.86 0 0"/></svg></i>
          <span>Work</span><span>Studio</span><b>Contact</b>
        </div>
        <div class="hero-copy" id="heroCopy">
          <h1>The mark becomes<br>the <em>interface.</em></h1>
          <p>One pinned viewport. The identity assembles, shrinks into the navigation, and the page composes itself in its wake.</p>
        </div>
        <div class="tiles" id="tiles">
          <div class="tile" style="background:linear-gradient(150deg,#0339f8,#04123f)"></div>
          <div class="tile" style="background:linear-gradient(150deg,#ff6a3d,#7a1f0c)"></div>
          <div class="tile" style="background:linear-gradient(150deg,#12d6a8,#053b30)"></div>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var capture = params.has('t');
  var rail = document.getElementById('rail');
  var mark = document.getElementById('mark'), pBlue = document.getElementById('pBlue'), pInk = document.getElementById('pInk');
  var navMock = document.getElementById('navMock'), heroCopy = document.getElementById('heroCopy');
  var tiles = [].slice.call(document.querySelectorAll('.tile'));
  var cap = document.getElementById('cap'), bar = document.getElementById('bar');

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function seg(p,s,e){ return clamp((p-s)/(e-s),0,1); }
  function ease(t){ return 1 - Math.pow(1 - t, 3); }
  function easeIO(t){ return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

  function render(p){
    // 1. halves fly in and lock (0 -> .28)
    var a = ease(seg(p, 0.02, 0.28));
    pBlue.style.transform = 'translateX(' + ((1-a) * 210).toFixed(2) + '%)';
    pInk.style.transform  = 'translateX(' + ((1-a) * -210).toFixed(2) + '%)';
    pBlue.style.opacity = pInk.style.opacity = Math.min(1, a * 1.6).toFixed(3);

    // 2. mark holds, then shrinks up into the nav (.34 -> .62)
    var b = easeIO(seg(p, 0.34, 0.62));
    var vh = innerHeight;
    var travelY = -vh * 0.5 + (window.innerWidth < 700 ? 74 : 92);
    mark.style.transform = 'translate3d(0,' + (b * travelY).toFixed(2) + 'px,0) scale(' + (1 - b * 0.938).toFixed(4) + ')';
    mark.style.opacity = (1 - seg(p, 0.55, 0.63)).toFixed(3);

    // 3. the real nav pill takes over (.56 -> .70)
    var c = ease(seg(p, 0.56, 0.72));
    navMock.style.opacity = c.toFixed(3);
    navMock.style.transform = 'translateX(-50%) translateY(' + ((1-c) * -14).toFixed(2) + 'px) scale(' + (0.94 + c * 0.06).toFixed(3) + ')';

    // 4. hero copy and tiles compose (.64 -> 1)
    var d = ease(seg(p, 0.66, 0.9));
    heroCopy.style.opacity = d.toFixed(3);
    heroCopy.style.transform = 'translate3d(0,' + ((1-d) * 46).toFixed(2) + 'px,0)';
    tiles.forEach(function(t, i){
      var e2 = ease(seg(p, 0.72 + i * 0.055, 0.93 + i * 0.02));
      t.style.opacity = e2.toFixed(3);
      t.style.transform = 'translate3d(0,' + ((1-e2) * 60).toFixed(2) + 'px,0) rotate(' + ((1-e2) * (i%2?6:-6)).toFixed(2) + 'deg)';
    });

    cap.style.opacity = (1 - seg(p, 0.06, 0.2)).toFixed(3);
    bar.style.width = (p * 100).toFixed(2) + '%';
  }

  if (capture) {
    document.body.style.overflow = 'hidden';
    rail.style.height = '100vh';
    render(parseFloat(params.get('t')) || 0);
  } else {
    var tick = false;
    function onScroll(){
      if (tick) return; tick = true;
      requestAnimationFrame(function(){
        tick = false;
        var r = rail.getBoundingClientRect();
        var total = rail.offsetHeight - innerHeight;
        render(clamp(-r.top / total, 0, 1));
      });
    }
    window.addEventListener('scroll', onScroll, {passive:true});
    window.addEventListener('resize', onScroll);
    onScroll();
  }
})();
</script>
</body>
</html>
